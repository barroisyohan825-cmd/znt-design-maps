<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b16"><title>Administration — ZNT DESIGN MAPS</title><style>
:root{--bg:#080b16;--panel:#11182a;--blue:#39a8ff;--text:#f5f8ff;--muted:#9ba9c3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#145c9b33,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:40px auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.brand{font-weight:950;letter-spacing:.08em}.brand span{color:var(--blue)}.card{background:var(--panel);border:1px solid #ffffff18;border-radius:18px;padding:24px;margin-bottom:18px}h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 8px}p{color:var(--muted);line-height:1.6}.auth{max-width:440px;margin:10vh auto}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{background:#080f1d;color:var(--text);border:1px solid #ffffff2b;border-radius:10px;padding:13px;font:inherit;width:100%}button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(110deg,#1687f5,#43c7ff);color:#06101b;font-weight:850;cursor:pointer}button.secondary{background:#ffffff14;color:var(--text);border:1px solid #ffffff24}button.danger{background:#51202a;color:#ffe2e7}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.message{color:#8edbff;min-height:24px}.orders{display:grid;gap:12px}.order{background:#0b1221;border:1px solid #ffffff16;border-radius:14px;padding:16px}.order-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.order h3{margin:0 0 7px}.meta{font-size:.86rem;color:var(--muted)}.details{white-space:pre-wrap;line-height:1.5;margin:12px 0}.order-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.order-controls select{background:#11182a;color:white;border:1px solid #ffffff30;border-radius:8px;padding:9px}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:560px){.wrap{margin:22px auto}.card{padding:18px}header{align-items:flex-start}}
</style></head><body><main class="wrap"><header><a class="brand" href="/">ZNT <span>DESIGN MAPS.</span></a><div class="top-actions"><a href="/" style="color:#b8c8e2;text-decoration:none;padding:10px">Voir le site ↗</a><button id="logout" class="secondary hidden">Déconnexion</button></div></header>
<section id="loginCard" class="card auth"><h1>Espace administrateur</h1><p>Connexion réservée au propriétaire de ZNT DESIGN MAPS.</p><form id="loginForm"><div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit">Se connecter</button></form><p id="loginMessage" class="message" aria-live="polite"></p></section>
<section id="dashboard" class="hidden"><div class="card"><h1>Mes commandes</h1><p>Retrouve ici les demandes envoyées depuis ton site. Seul un compte administrateur autorisé peut les consulter.</p><div class="top-actions"><button id="refresh" class="secondary">Actualiser</button><span id="count" class="meta" style="align-self:center"></span></div><p id="dashMessage" class="message" aria-live="polite"></p></div><div id="orders" class="orders"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
const cfg=window.ZNT_CONFIG||{};const ready=cfg.supabaseUrl&&cfg.supabaseAnonKey&&!cfg.supabaseUrl.includes('COLLE_ICI')&&!cfg.supabaseAnonKey.includes('COLLE_ICI');
const loginCard=document.getElementById('loginCard'),dashboard=document.getElementById('dashboard'),logout=document.getElementById('logout');let db=null;
function msg(id,t){document.getElementById(id).textContent=t}
function show(session){loginCard.classList.toggle('hidden',!!session);dashboard.classList.toggle('hidden',!session);logout.classList.toggle('hidden',!session);if(session)loadOrders()}
if(ready){db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);db.auth.getSession().then(({data})=>show(data.session));db.auth.onAuthStateChange((_e,s)=>show(s));}else{msg('loginMessage','Configuration Supabase à terminer avant de pouvoir se connecter.')}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;msg('loginMessage','Connexion…');const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});msg('loginMessage',error?'Connexion impossible. Vérifie tes identifiants.':'')});
logout.addEventListener('click',async()=>{if(db)await db.auth.signOut()});document.getElementById('refresh').addEventListener('click',loadOrders);
async function loadOrders(){if(!db)return;msg('dashMessage','Chargement…');const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){msg('dashMessage','Impossible de charger les commandes. Vérifie les règles SQL Supabase.');return;}msg('dashMessage','');document.getElementById('count').textContent=data.length+' commande(s)';const root=document.getElementById('orders');root.innerHTML='';if(!data.length){root.innerHTML='<div class="card empty">Aucune commande pour le moment.</div>';return;}for(const o of data){const el=document.createElement('article');el.className='order';const date=new Date(o.created_at).toLocaleString('fr-FR');el.innerHTML=`<div class="order-head"><div><h3>${esc(o.type)}</h3><div class="meta">${esc(o.pseudo)} · ${date}</div></div><div class="meta">${esc(o.status||'En attente')}</div></div><div class="details">${esc(o.details)}</div><p class="meta">Contact : ${esc(o.contact)}</p><div class="order-controls"><label>Statut <select data-status="${o.id}"><option ${o.status==='En attente'?'selected':''}>En attente</option><option ${o.status==='En cours'?'selected':''}>En cours</option><option ${o.status==='Terminée'?'selected':''}>Terminée</option></select></label><button data-save="${o.id}">Enregistrer</button><button class="danger" data-delete="${o.id}">Supprimer</button></div>`;root.appendChild(el);}root.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save;const status=root.querySelector(`[data-status="${id}"]`).value;const {error}=await db.from('orders').update({status}).eq('id',id);msg('dashMessage',error?'Erreur lors de la mise à jour.':'Statut mis à jour.');if(!error)loadOrders()});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement cette commande ?'))return;const {error}=await db.from('orders').delete().eq('id',b.dataset.delete);msg('dashMessage',error?'Suppression impossible.':'Commande supprimée.');if(!error)loadOrders()});}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
